
name: Extract Fikri Store Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project files
        run: |
          mkdir -p /tmp/fikri-project
          unzip -q fikri-export.zip -d /tmp/fikri-project
          cp -R /tmp/fikri-project/fikri-export/. .
          rm -rf src node_modules dist

      - name: Commit project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Add Fikri Store source code"
          git push
          
